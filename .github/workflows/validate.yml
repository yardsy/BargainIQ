name: Validate BargainIQ
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          scripts=[]
          for page in ['index.html','account.html']:
              html=pathlib.Path(page).read_text()
              scripts.extend(re.findall(r'<script>(.*?)</script>',html,re.S))
          assert scripts
          with tempfile.TemporaryDirectory() as folder:
              for i, script in enumerate(scripts):
                  p=pathlib.Path(folder)/f'{i}.js'
                  p.write_text(script)
                  subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run isolated browser smoke checks
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/bargainiq-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          python browser_smoke.py
