name: CarRadar stock refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: carradar-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - name: Collect approved sources only
        env:
          APPROVED: ${{ vars.APPROVED_DEALERS }}
        run: |
          if [ -n "$APPROVED" ]; then
            read -ra dealers <<< "$APPROVED"
            python collector.py --approved "${dealers[@]}"
            git config user.name 'CarRadar bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add stock.json history.json
            if ! git diff --cached --quiet; then git commit -m 'Refresh dealer stock'; git push; fi
          else
            echo 'No approved sources configured; publishing historical seed only.'
          fi
      - run: |
          mkdir public
          cp index.html stock.json public/
      - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public
          retention-days: 1

      - name: Deploy website
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

