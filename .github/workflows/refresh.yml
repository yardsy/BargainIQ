name: CarRadar stock refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: carradar-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest -v

      - name: Collect approved sources
        env:
          APPROVED: ${{ vars.APPROVED_DEALERS }}
        run: |
          if [ -n "$APPROVED" ]; then
            read -ra dealers <<< "$APPROVED"
            python collector.py --approved "${dealers[@]}"
            git config user.name "CarRadar bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stock.json history.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh dealer stock"
              git push
            fi
          else
            echo "No approved sources configured."
          fi

      - name: Prepare website
        run: |
          mkdir -p public
          cp index.html stock.json public/
          for f in retail.json history.json; do
            if [ -f "$f" ]; then cp "$f" public/; fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
